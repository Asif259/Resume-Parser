# Nginx Reverse Proxy Configuration for NLP Resume Parser API
# Place in /etc/nginx/sites-available/resume-parser-api.conf and symlink to /etc/nginx/sites-enabled/

# Rate limiting zone: 10 requests per second with bursts up to 20
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

# Upstream definition pointing to local Docker container port
upstream resume_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 1. HTTP Server Block (Redirects all HTTP traffic to HTTPS, supports Certbot challenge)
server {
    listen 80;
    listen [::]:80;
    server_name api.YOUR_DOMAIN.com;

    # Let's Encrypt / Certbot ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOUR_DOMAIN.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Include common security headers
    include /etc/nginx/snippets/security-headers.conf;

    # File upload limit: 12MB (accommodates 10MB payload + multipart boundary overhead)
    client_max_body_size 12M;

    # Access and Error Logging (Exclude sensitive payload data)
    access_log /var/log/nginx/resume_api_access.log combined;
    error_log /var/log/nginx/resume_api_error.log warn;

    # Reverse proxy to FastAPI Docker container
    location / {
        # Apply rate limiting
        limit_req zone=api_rate_limit burst=20 nodelay;

        proxy_pass http://resume_backend;
        proxy_http_version 1.1;

        # Connection and header forwarding
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts tailored for ML transformer inference and OCR extraction
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Dedicated Healthcheck location (exempt from rate limit)
    location /health {
        proxy_pass http://resume_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }
}
